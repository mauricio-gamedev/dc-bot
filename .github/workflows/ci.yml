name: Validate Discord Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Syntax, imports and community config
        run: npm run check

  build-mindustry-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build Android Mindustry mod
        working-directory: integrations/mindustry-mod
        run: gradle --no-daemon clean deploy

      - name: Verify Android JAR
        run: |
          test -f integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar
          unzip -l integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar | grep -q "mod.hjson"
          unzip -l integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar | grep -q "classes.dex"

      - name: Upload Mindustry Android JAR
        uses: actions/upload-artifact@v4
        with:
          name: MiojoPlaysInteractive-Android
          path: integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar
          if-no-files-found: error
          retention-days: 30

      - name: Synchronize direct-download JAR on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar downloads/MiojoPlaysInteractive.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/MiojoPlaysInteractive.jar
          if git diff --cached --quiet; then
            echo "Direct-download JAR already synchronized."
            exit 0
          fi
          git commit -m "chore(mindustry): refresh Android JAR [skip ci]"
          git push

  build-voice-android:
    permissions:
      contents: write
    needs: build-mindustry-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build Mio Voice Android APK
        working-directory: integrations/voice-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Mio Voice APK
        run: |
          APK="integrations/voice-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"

      - name: Upload Mio Voice Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MioVoice-Android
          path: integrations/voice-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Synchronize direct-download APK on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp integrations/voice-android/app/build/outputs/apk/debug/app-debug.apk /tmp/MioVoice.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/MioVoice.apk downloads/MioVoice.apk
          git add downloads/MioVoice.apk
          if git diff --cached --quiet; then
            echo "Direct-download APK already synchronized."
            exit 0
          fi
          git commit -m "chore(voice): refresh Android APK [skip ci]"
          git push origin main

  verify-render-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, build-mindustry-android, build-voice-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployed bot version, commit and private mode
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          HEALTH_URL="https://dc-bot-us5v.onrender.com/health"
          LAST_BODY=""

          for attempt in $(seq 1 90); do
            LAST_BODY="$(curl -fsS --max-time 20 "$HEALTH_URL" || true)"

            if BODY="$LAST_BODY" VERSION="$VERSION" node -e '
              try {
                const health = JSON.parse(process.env.BODY || "{}");
                const automation = health.communityAutomation || {};
                const ok = health.ok === true
                  && health.discord === "online"
                  && health.version === process.env.VERSION
                  && health.privateGuildMode === true
                  && typeof health.deployCommit === "string"
                  && health.deployCommit.length >= 7
                  && automation.enabled === true
                  && Number(automation.runs || 0) >= 1
                  && Boolean(automation.lastStructuralRunAt)
                  && !automation.lastError;
                process.exit(ok ? 0 : 1);
              } catch {
                process.exit(1);
              }
            '; then
              echo "Render deploy healthy: version $VERSION, private guild mode and automation verified."
              echo "$LAST_BODY"
              exit 0
            fi
            sleep 10
          done

          echo "Render deployment did not reach the expected healthy state."
          echo "Last health response: $LAST_BODY"
          exit 1
