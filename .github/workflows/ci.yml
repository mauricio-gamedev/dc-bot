name: Validate Discord Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

  build-mindustry-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build Android Mindustry mod
        working-directory: integrations/mindustry-mod
        run: gradle --no-daemon clean deploy

      - name: Verify Android JAR
        run: |
          test -f integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar
          unzip -l integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar | grep -q "mod.hjson"
          unzip -l integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar | grep -q "classes.dex"

      - name: Upload Mindustry Android JAR
        uses: actions/upload-artifact@v4
        with:
          name: MiojoPlaysInteractive-Android
          path: integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar
          if-no-files-found: error
          retention-days: 30

      - name: Synchronize direct-download JAR on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar downloads/MiojoPlaysInteractive.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/MiojoPlaysInteractive.jar
          if git diff --cached --quiet; then
            echo "Direct-download JAR already synchronized."
            exit 0
          fi
          git commit -m "chore(mindustry): refresh Android JAR [skip ci]"
          git push
