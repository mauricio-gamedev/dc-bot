name: Validate Discord Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Android Bedrock relay
        working-directory: tools/bedrock-relay
        run: go build ./...
