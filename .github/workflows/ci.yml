name: Validate Discord Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

  build-mindustry-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build Android Mindustry mod
        working-directory: integrations/mindustry-mod
        run: gradle --no-daemon clean deploy

      - name: Verify Android JAR
        run: |
          test -f integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar
          unzip -l integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar | grep -q "mod.hjson"
          unzip -l integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar | grep -q "classes.dex"

      - name: Upload Mindustry Android JAR
        uses: actions/upload-artifact@v4
        with:
          name: MiojoPlaysInteractive-Android
          path: integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar
          if-no-files-found: error
          retention-days: 30

      - name: Synchronize direct-download JAR on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp integrations/mindustry-mod/build/libs/MiojoPlaysInteractive.jar downloads/MiojoPlaysInteractive.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/MiojoPlaysInteractive.jar
          if git diff --cached --quiet; then
            echo "Direct-download JAR already synchronized."
            exit 0
          fi
          git commit -m "chore(mindustry): refresh Android JAR [skip ci]"
          git push

  verify-render-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, build-mindustry-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployed bot version, commit and visual assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          BASE_URL="https://dc-bot-us5v.onrender.com"
          HEALTH_URL="$BASE_URL/health"
          CDN_BASE="https://cdn.jsdelivr.net/gh/mauricio-gamedev/dc-bot@a0836d6ef188f7ba15896e31293d2a51123981b3/assets"
          LAST_BODY=""
          CHARACTER_FILE="$(mktemp)"
          STATIC_SEAL_FILE="$(mktemp)"
          ANIMATED_SEAL_FILE="$(mktemp)"
          trap 'rm -f "$CHARACTER_FILE" "$STATIC_SEAL_FILE" "$ANIMATED_SEAL_FILE"' EXIT

          for attempt in $(seq 1 90); do
            LAST_BODY="$(curl -fsS --max-time 20 "$HEALTH_URL" || true)"
            RENDER_ASSETS_OK=0
            CDN_ASSETS_OK=0

            if curl -fsS --max-time 20 "$BASE_URL/assets/mio-character.webp" -o "$CHARACTER_FILE" \
              && [ "$(head -c 4 "$CHARACTER_FILE")" = "RIFF" ] \
              && [ "$(dd if="$CHARACTER_FILE" bs=1 skip=8 count=4 2>/dev/null)" = "WEBP" ]; then
              RENDER_ASSETS_OK=1
            fi

            if curl -fsS --max-time 20 "$CDN_BASE/mio-character.webp" -o "$CHARACTER_FILE" \
              && [ "$(head -c 4 "$CHARACTER_FILE")" = "RIFF" ] \
              && [ "$(dd if="$CHARACTER_FILE" bs=1 skip=8 count=4 2>/dev/null)" = "WEBP" ] \
              && curl -fsS --max-time 20 "$CDN_BASE/miojo-seal-static.png" -o "$STATIC_SEAL_FILE" \
              && [ "$(xxd -p -l 8 "$STATIC_SEAL_FILE")" = "89504e470d0a1a0a" ] \
              && curl -fsS --max-time 20 "$CDN_BASE/miojo-seal-animated.gif" -o "$ANIMATED_SEAL_FILE" \
              && [ "$(head -c 3 "$ANIMATED_SEAL_FILE")" = "GIF" ]; then
              CDN_ASSETS_OK=1
            fi

            if BODY="$LAST_BODY" VERSION="$VERSION" node -e '
              try {
                const health = JSON.parse(process.env.BODY || "{}");
                const automation = health.communityAutomation || {};
                const ok = health.ok === true
                  && health.discord === "online"
                  && health.version === process.env.VERSION
                  && typeof health.deployCommit === "string"
                  && health.deployCommit.length >= 7
                  && automation.enabled === true
                  && Number(automation.runs || 0) >= 1
                  && Boolean(automation.lastStructuralRunAt)
                  && !automation.lastError;
                process.exit(ok ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' && [ "$RENDER_ASSETS_OK" -eq 1 ] && [ "$CDN_ASSETS_OK" -eq 1 ]; then
              echo "Render deploy healthy: version $VERSION, commit fingerprint and official visual assets active."
              echo "$LAST_BODY"
              exit 0
            fi
            sleep 10
          done

          echo "Render deployment did not reach the expected healthy state."
          echo "Last health response: $LAST_BODY"
          exit 1
